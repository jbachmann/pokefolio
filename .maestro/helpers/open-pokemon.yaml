appId: com.anonymous.pokefolio
---
- tapOn:
    id: nav-pokedex
    waitToSettleTimeoutMs: 500
- runFlow:
    file: ../helpers/search.yaml
    env:
      QUERY: ${POKEMON_ID}
- scrollUntilVisible:
    element:
      id: pokemon-open-${POKEMON_ID}
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- tapOn:
    id: pokemon-open-${POKEMON_ID}
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: pokemon-detail-number
    timeout: 10000
- scrollUntilVisible:
    element:
      id: pokemon-detail-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
