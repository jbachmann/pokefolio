appId: com.anonymous.pokefolio
---
- scrollUntilVisible:
    element:
      id: type-options
    direction: UP
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- repeat:
    times: 8
    while:
      notVisible:
        id: type-select-${TYPE}
    commands:
      - swipe:
          from:
            id: type-options
          direction: LEFT
          waitToSettleTimeoutMs: 500
- tapOn:
    id: type-select-${TYPE}
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: type-summary-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: type-summary-name
    text: ${TITLE}, at a glance\.
