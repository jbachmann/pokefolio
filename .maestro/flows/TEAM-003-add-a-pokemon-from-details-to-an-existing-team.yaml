appId: com.anonymous.pokefolio
name: TEAM-003 Add a Pokémon from details to an existing team
properties:
  scenarioId: TEAM-003
  feature: e2e/features/teams.feature
---
# Given I open Pokéfolio with no saved application data
- runFlow:
    file: ../helpers/fresh-launch.yaml
# Given I have an empty team named "Trail Friends"
- runFlow:
    file: ../helpers/create-team.yaml
    env:
      TEAM: Trail Friends
# When I open Charmander's details
- runFlow:
    file: ../helpers/open-pokemon.yaml
    env:
      POKEMON_ID: "4"
# And I add Charmander to Trail Friends
- scrollUntilVisible:
    element:
      text: Add to a team
    timeout: 10000
    waitToSettleTimeoutMs: 500
- tapOn:
    text: Add to a team
    waitToSettleTimeoutMs: 500
- tapOn:
    id: picker-team-Trail Friends
    waitToSettleTimeoutMs: 500
- runFlow:
    file: ../helpers/wait-for-notice.yaml
# Then Trail Friends contains Charmander as its only partner
- tapOn:
    id: nav-teams
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: team-selected-name
    direction: UP
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: team-selected-name
    text: Trail Friends
- assertVisible:
    id: team-member-count
    text: 1 of 6 partners.*
- scrollUntilVisible:
    element:
      id: team-member-4
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: team-member-4
