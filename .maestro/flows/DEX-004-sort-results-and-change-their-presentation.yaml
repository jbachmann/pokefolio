appId: com.anonymous.pokefolio
name: DEX-004 Sort results and change their presentation
properties:
  scenarioId: DEX-004
  feature: e2e/features/pokedex.feature
---
# Given I open Pokéfolio with no saved application data
- runFlow:
    file: ../helpers/fresh-launch.yaml
# Given I have selected Generation I and searched for "char"
- tapOn:
    text: Choose a generation
    waitToSettleTimeoutMs: 500
- tapOn:
    text: I · Kanto
    waitToSettleTimeoutMs: 500
- runFlow:
    file: ../helpers/search.yaml
    env:
      QUERY: char
# When I sort by name from A to Z
- tapOn:
    text: Sort Pokémon
    waitToSettleTimeoutMs: 500
- tapOn:
    text: Name A–Z
    waitToSettleTimeoutMs: 500
# Then the results are ordered Charizard, Charmander, Charmeleon
- scrollUntilVisible:
    element:
      id: pokemon-result-0-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-0-name
    text: Charizard
- scrollUntilVisible:
    element:
      id: pokemon-result-1-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-1-name
    text: Charmander
- scrollUntilVisible:
    element:
      id: pokemon-result-2-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-2-name
    text: Charmeleon
# When I switch to list view
- runFlow:
    file: ../helpers/directory-controls.yaml
- tapOn:
    text: List view
    waitToSettleTimeoutMs: 500
# Then the same results remain in the same order
- runFlow:
    file: ../helpers/directory-controls.yaml
- assertVisible:
    text: List view
    selected: true
- scrollUntilVisible:
    element:
      id: pokemon-result-0-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-0-name
    text: Charizard
- scrollUntilVisible:
    element:
      id: pokemon-result-1-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-1-name
    text: Charmander
- scrollUntilVisible:
    element:
      id: pokemon-result-2-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-2-name
    text: Charmeleon
# When I sort by highest number first
- runFlow:
    file: ../helpers/directory-controls.yaml
- tapOn:
    text: Sort Pokémon
    waitToSettleTimeoutMs: 500
- tapOn:
    text: Number ↓
    waitToSettleTimeoutMs: 500
# Then the results are ordered Charizard, Charmeleon, Charmander
- scrollUntilVisible:
    element:
      id: pokemon-result-0-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-0-name
    text: Charizard
- scrollUntilVisible:
    element:
      id: pokemon-result-1-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-1-name
    text: Charmeleon
- scrollUntilVisible:
    element:
      id: pokemon-result-2-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-2-name
    text: Charmander
# When I switch to grid view
- runFlow:
    file: ../helpers/directory-controls.yaml
- tapOn:
    text: Grid view
    waitToSettleTimeoutMs: 500
# Then the results retain that order
- runFlow:
    file: ../helpers/directory-controls.yaml
- assertVisible:
    text: Grid view
    selected: true
- scrollUntilVisible:
    element:
      id: pokemon-result-0-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-0-name
    text: Charizard
- scrollUntilVisible:
    element:
      id: pokemon-result-1-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-1-name
    text: Charmeleon
- scrollUntilVisible:
    element:
      id: pokemon-result-2-name
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: pokemon-result-2-name
    text: Charmander
