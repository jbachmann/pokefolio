appId: com.anonymous.pokefolio
name: TEAM-006 Reject a duplicate partner
properties:
  scenarioId: TEAM-006
  feature: e2e/features/teams.feature
---
# Given I open Pokéfolio with no saved application data
- runFlow:
    file: ../helpers/fresh-launch.yaml
# Given Trail Friends contains Bulbasaur
- runFlow:
    file: ../helpers/create-team.yaml
    env:
      TEAM: Trail Friends
- runFlow:
    file: ../helpers/add-partner.yaml
    env:
      POKEMON_ID: "1"
      TEAM: Trail Friends
# When I try to add Bulbasaur to Trail Friends again
- runFlow:
    file: ../helpers/pick-partner.yaml
    env:
      POKEMON_ID: "1"
- tapOn:
    id: picker-team-Trail Friends
    waitToSettleTimeoutMs: 500
# Then the picker explains that Bulbasaur is already on the team
- assertVisible: Bulbasaur is already on this team\.
# And the team still has exactly one partner
- tapOn:
    id: dialog-close
    waitToSettleTimeoutMs: 500
- tapOn:
    id: nav-teams
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: team-selected-name
    direction: UP
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: team-selected-name
    text: Trail Friends
- assertVisible:
    id: team-member-count
    text: 1 of 6 partners.*
- scrollUntilVisible:
    element:
      id: team-member-1
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: team-member-1
