appId: com.anonymous.pokefolio
name: TEAM-002 Create a team while choosing a Pokémon
properties:
  scenarioId: TEAM-002
  feature: e2e/features/teams.feature
tags:
  - smoke
---
# Given I open Pokéfolio with no saved application data
- runFlow:
    file: ../helpers/fresh-launch.yaml
# When I choose to add Bulbasaur from its card
- runFlow:
    file: ../helpers/pick-partner.yaml
    env:
      POKEMON_ID: "1"
# And I create "Trail Friends" in the team picker
- tapOn:
    id: picker-team-name
    waitToSettleTimeoutMs: 500
- inputText: Trail Friends
- tapOn:
    id: picker-create-team
    waitToSettleTimeoutMs: 500
- runFlow:
    file: ../helpers/wait-for-notice.yaml
# And I open My teams
- tapOn:
    id: nav-teams
    waitToSettleTimeoutMs: 500
# Then Trail Friends contains Bulbasaur as its only partner
- tapOn:
    id: nav-teams
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: team-selected-name
    direction: UP
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: team-selected-name
    text: Trail Friends
- assertVisible:
    id: team-member-count
    text: 1 of 6 partners.*
- scrollUntilVisible:
    element:
      id: team-member-1
    direction: DOWN
    timeout: 10000
    centerElement: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: team-member-1
